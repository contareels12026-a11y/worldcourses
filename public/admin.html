<!DOCTYPE html><html lang="pt" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=16"><link rel="stylesheet" href="/platform.css?v=16">
<script src="/i18n.js?v=16"></script><script src="/app.js?v=16"></script><title>Administração — The World Courses</title></head><body data-page="admin">
<div id="chrome-top"></div>
<main class="wrap page" id="adm"></main><div id="chrome-foot"></div>
<script>
const KEYS=[['platform_share',0.01],['w_complete',0.1],['complete_threshold',0.01],['min_pct',0.01],['partial_factor',0.1]];
function visitsHTML(V){const T=V.totals,mx=Math.max(1,...V.daily.map(d=>d.views)),W=12,H=90;
 const bars=V.daily.map((d,i)=>{const h=Math.round(d.views/mx*H),hv=Math.round(d.visitors/mx*H);return`<g><title>${d.day}: ${d.views} ${t('v_views')} · ${d.visitors} ${t('v_visitors')}</title><rect x="${i*W+1}" y="${H-h}" width="${W-2}" height="${h}" fill="#c9a24a" opacity=".45"/><rect x="${i*W+3}" y="${H-hv}" width="${W-6}" height="${hv}" fill="#e6c36a"/></g>`}).join('');
 const k=(l,o)=>`<div><span>${t(l)}</span><b>${o.views}</b><small class="muted">${o.visitors} ${t('v_visitors')}</small></div>`;
 return`<div class="kpis">${k('v_today',T.today)}${k('v_7',T.d7)}${k('v_30',T.d30)}${k('v_all',T.all)}</div>
 <div class="panel"><p class="tiny muted">${t('v_daily')}</p><svg viewBox="0 0 ${30*W} ${H+2}" width="100%" height="120" preserveAspectRatio="none" role="img" aria-label="${t('v_daily')}">${bars}<line x1="0" y1="${H+1}" x2="${30*W}" y2="${H+1}" stroke="#555"/></svg><p class="tiny muted">${V.daily[0].day} → ${V.daily[29].day} · <span style="color:#e6c36a">■</span> ${t('v_visitors')} <span style="color:#c9a24a;opacity:.6">■</span> ${t('v_views')}</p></div>
 <div class="form-grid"><div><h3>${t('v_pages')}</h3>${V.top_pages.length?`<table class="tbl"><tr><th>${t('v_page')}</th><th>${t('v_views')}</th><th>${t('v_visitors')}</th></tr>${V.top_pages.map(r=>`<tr><td>${esc(r.path)}</td><td>${r.views}</td><td>${r.visitors}</td></tr>`).join('')}</table>`:`<div class="empty">${t('v_none')}</div>`}</div>
 <div><h3>${t('v_refs')}</h3>${V.top_referrers.length?`<table class="tbl"><tr><th>${t('v_ref')}</th><th>${t('v_views')}</th></tr>${V.top_referrers.map(r=>`<tr><td>${esc(r.ref_host)}</td><td>${r.views}</td></tr>`).join('')}</table>`:`<div class="empty">${t('v_none')}</div>`}</div></div>`}
async function load(month){const m=document.getElementById('adm');
 if(!ME||ME.role!=='admin'){m.innerHTML=`<p class="err">${t('not_allowed')}</p><a class="btn gold" href="/login.html?next=/admin.html">${t('login')}</a>`;return}
 const r=await api('/api/admin/payouts'+(month?'?month='+month:''));const F=await api('/api/admin/feedback');const IDS=await api('/api/admin/ideas');const V=await api('/api/admin/visits');const s=r.settings;
 m.innerHTML=`<div class="dash-head"><h1>${t('admin')} · ${t('payout_table')}</h1><label>${t('period')} <input type="month" id="month" value="${r.period.month}"></label></div>
 <div class="kpis"><div><span>${t('subs')}</span><b>${eur(r.revenue.subscription)}</b></div><div><span>${t('purchases_c')}</span><b>${eur(r.revenue.course)}</b></div><div><span>${t('purchases_l')}</span><b>${eur(r.revenue.lesson)}</b></div><div><span>${t('gross')}</span><b>${eur(r.gross)}</b></div><div><span>${t('platform_cut')} (${Math.round(s.platform_share*100)}%)</span><b>${eur(r.platform)}</b></div><div class="gold-k"><span>${t('pool')}</span><b>${eur(r.pool)}</b></div></div>
 <table class="tbl"><tr><th>${t('creator')}</th><th>${t('views')}</th><th>${t('completions')}</th><th>${t('partial')}</th><th>${t('ignored')}</th><th>${t('watch_min')}</th><th>${t('weight')}</th><th>${t('share')}</th><th>${t('est_earn')}</th></tr>
 ${r.table.map(x=>`<tr><td>${esc(x.name)}<br><small class="muted">${esc(x.email)}</small></td><td>${x.views}</td><td>${x.completions}</td><td>${x.partial}</td><td>${x.ignored}</td><td>${x.watch_minutes}</td><td>${x.weight}</td><td>${(x.share*100).toFixed(2)}%</td><td><b>${eur(x.earnings)}</b></td></tr>`).join('')}
 <tr class="tot"><td>Σ</td><td colspan="5"></td><td>${r.total_weight}</td><td>100%</td><td><b>${eur(r.table.reduce((a,x)=>a+x.earnings,0))}</b></td></tr></table>
 <h2>${t('settings')}</h2><form id="st" class="panel form-grid">${KEYS.map(([k,st])=>`<label>${t(k)}<input type="number" step="${st}" name="${k}" value="${s[k]}"></label>`).join('')}<label>${t('launch_date')}<input type="date" name="launch_date" value="${s.launch_date}"></label><label>${t('feedback_months')}<input type="number" min="0" max="36" name="feedback_months" value="${s.feedback_months}"></label>
 <label>${t('promo_months')}<input type="number" min="0" max="24" name="promo_months" value="${s.promo_months}"></label><label class="chk">${t('promo_enabled')}<select name="promo_enabled"><option value="1" ${s.promo_enabled===1?'selected':''}>✓</option><option value="0" ${s.promo_enabled!==1?'selected':''}>✗</option></select></label>
 <button class="btn gold">${t('save')}</button><span id="stOk" class="ok"></span></form>
 <h2>${t('site_feedback')} ${F.count?`<span class="rv-avg">★ ${F.avg} · ${F.count}</span>`:''} <a class="btn ghost sm" href="/api/admin/feedback.csv">⬇ ${t('export_csv')}</a></h2>
 ${F.count?`<table class="tbl"><tr><th>${t('date')}</th><th>${t('user')}</th><th>${t('rating')}</th><th>${t('fb_comment')}</th><th>${t('fb_improve')}</th></tr>${F.items.map(i=>`<tr><td>${esc(i.created_at.slice(0,16))}</td><td>${esc(i.name)}<br><small class="muted">${esc(i.email)}</small></td><td>${'★'.repeat(i.rating)}</td><td>${esc(i.comment)}</td><td>${esc(i.improve)}</td></tr>`).join('')}</table>`:`<div class="empty">${t('no_feedback')}</div>`}
 <h2 id="visits">${t('visits_t')}</h2>${visitsHTML(V)}
 <h2 id="ideas">${t('ideas_t')} <span class="rv-avg">${IDS.length}</span> <a class="btn ghost sm" href="/api/admin/ideas.csv">⬇ ${t('export_csv')}</a></h2>
 ${IDS.length?`<table class="tbl"><tr><th>${t('date')}</th><th>${t('op_want')}</th><th>${t('op_topic')}</th><th>${t('op_cat')}</th><th>${t('op_create')}</th><th>Email</th><th>${t('op_msg')}</th><th></th></tr>${IDS.map(i=>`<tr><td>${esc(String(i.created_at).slice(0,16))}</td><td>${esc(i.want)}</td><td>${esc(i.topic)}</td><td>${i.category?esc(i.category==='other'?t('op_other'):t('c_'+i.category).replace(/<br>/g,' ')):''}</td><td>${i.would_create?t('op_'+i.would_create):''}</td><td>${esc(i.email||'')}${i.user_email?`<br><small class="muted">👤 ${esc(i.user_email)}</small>`:''}</td><td>${esc(i.message)}</td><td><button class="btn ghost sm" data-del="${i.id}">🗑</button></td></tr>`).join('')}</table>`:`<div class="empty">${t('no_ideas')}</div>`}
 <p class="formula">w(v) = 0 se pct &lt; ${s.min_pct} · ${s.w_complete} se pct ≥ ${s.complete_threshold} · pct × ${s.partial_factor} × ${s.w_complete} caso contrário</p>`;
 m.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm(t('del_confirm')))return;await api('/api/admin/ideas/'+b.dataset.del,{method:'DELETE'});load(document.getElementById('month').value)});
 document.getElementById('month').onchange=e=>load(e.target.value);
 document.getElementById('st').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings',{method:'PUT',body:Object.fromEntries(new FormData(e.target))});load(document.getElementById('month').value)}catch(x){alert('Erro: '+(x.data&&x.data.field||x.message))}}}
READY.then(()=>load());
</script></body></html>
